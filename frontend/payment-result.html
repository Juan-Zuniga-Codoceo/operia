<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del Pago - Operia</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .result-container {
            background: white;
            border-radius: 16px;
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .result-icon.success {
            color: #27ae60;
        }

        .result-icon.error {
            color: #e74c3c;
        }

        .result-icon.pending {
            color: #f39c12;
        }

        h1 {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .result-message {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .payment-details {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .payment-details h3 {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ecf0f1;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #7f8c8d;
            font-weight: 500;
        }

        .detail-value {
            color: #2c3e50;
            font-weight: 600;
        }

        .btn-primary {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #006837 0%, #00a651 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(0, 104, 55, 0.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #006837;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="result-container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Verificando el estado de tu pago...</p>
        </div>

        <div id="result" style="display: none;">
            <div class="result-icon" id="result-icon"></div>
            <h1 id="result-title"></h1>
            <p class="result-message" id="result-message"></p>

            <div class="payment-details" id="payment-details" style="display: none;">
                <h3>Detalles del Pago</h3>
                <div class="detail-row">
                    <span class="detail-label">Plan:</span>
                    <span class="detail-value" id="detail-plan"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Monto:</span>
                    <span class="detail-value" id="detail-amount"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Orden:</span>
                    <span class="detail-value" id="detail-order"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Estado:</span>
                    <span class="detail-value" id="detail-status"></span>
                </div>
            </div>

            <a href="/tablero" class="btn-primary">Ir al Tablero</a>
        </div>
    </div>

    <script>
        async function checkPaymentStatus() {
            try {
                // Get token from URL
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');

                if (!token) {
                    showError('No se encontró el token de pago');
                    return;
                }

                // Wait a bit for webhook to process
                await new Promise(resolve => setTimeout(resolve, 2000));

                // Get payment status from our backend
                const authToken = localStorage.getItem('token');
                if (!authToken) {
                    window.location.href = '/login';
                    return;
                }

                // Get payment history to find this payment
                const response = await fetch('/api/payments/history', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Error al obtener historial de pagos');
                }

                const data = await response.json();

                // Find the most recent payment
                const payment = data.payments[0];

                if (!payment) {
                    showError('No se encontró información del pago');
                    return;
                }

                // Show result based on status
                if (payment.status === 'completed') {
                    showSuccess(payment);
                } else if (payment.status === 'pending') {
                    showPending(payment);
                } else {
                    showError('El pago no pudo ser procesado', payment);
                }

            } catch (err) {
                console.error('Error al verificar pago:', err);
                showError('Error al verificar el estado del pago');
            }
        }

        function showSuccess(payment) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('result').style.display = 'block';

            document.getElementById('result-icon').textContent = '✅';
            document.getElementById('result-icon').className = 'result-icon success';
            document.getElementById('result-title').textContent = '¡Pago Exitoso!';
            document.getElementById('result-message').textContent = 'Tu pago ha sido procesado correctamente. Tu plan ha sido actualizado y ya puedes disfrutar de todas las funcionalidades.';

            showPaymentDetails(payment);
        }

        function showPending(payment) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('result').style.display = 'block';

            document.getElementById('result-icon').textContent = '⏳';
            document.getElementById('result-icon').className = 'result-icon pending';
            document.getElementById('result-title').textContent = 'Pago Pendiente';
            document.getElementById('result-message').textContent = 'Tu pago está siendo procesado. Te notificaremos cuando se complete. Esto puede tomar unos minutos.';

            showPaymentDetails(payment);
        }

        function showError(message, payment = null) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('result').style.display = 'block';

            document.getElementById('result-icon').textContent = '❌';
            document.getElementById('result-icon').className = 'result-icon error';
            document.getElementById('result-title').textContent = 'Error en el Pago';
            document.getElementById('result-message').textContent = message || 'Hubo un problema al procesar tu pago. Por favor, intenta nuevamente o contacta a soporte.';

            if (payment) {
                showPaymentDetails(payment);
            }
        }

        function showPaymentDetails(payment) {
            const detailsDiv = document.getElementById('payment-details');
            detailsDiv.style.display = 'block';

            document.getElementById('detail-plan').textContent = payment.plan.charAt(0).toUpperCase() + payment.plan.slice(1);
            document.getElementById('detail-amount').textContent = `$${payment.amount.toLocaleString('es-CL')} CLP`;
            document.getElementById('detail-order').textContent = payment.flow_order;

            const statusText = {
                'completed': 'Completado',
                'pending': 'Pendiente',
                'failed': 'Fallido',
                'cancelled': 'Cancelado'
            };
            document.getElementById('detail-status').textContent = statusText[payment.status] || payment.status;
        }

        // Check payment status on load
        checkPaymentStatus();
    </script>
</body>

</html>
